<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>

    <!-- Accent Lines Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D6F24A"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Glowing Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5" opacity="0.6"/>
    </pattern>

    <style>
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #F8FAFC; letter-spacing: -1px; }
      .sub-text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-weight: 500; fill: #94A3B8; font-size: 13px; letter-spacing: 1.5px; }
      .tagline { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; fill: #E2E8F0; font-size: 14px; }
      .accent-badge { font-family: 'SFMono-Regular', Consolas, monospace; font-weight: 700; fill: #D6F24A; font-size: 11px; letter-spacing: 1px; }
      .dim-text { font-family: 'SFMono-Regular', Consolas, monospace; fill: #64748B; font-size: 11px; }

      /* Keyframe Animations */
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.85); }
      }
      .pulsing-dot { animation: pulseDot 2s infinite ease-in-out; transform-origin: center; }

      @keyframes scanline {
        0% { stroke-dashoffset: 760; }
        100% { stroke-dashoffset: 0; }
      }
      .flowing-line { stroke-dasharray: 200 560; animation: scanline 4s linear infinite; }
    </style>
  </defs>

  <!-- Container Box with Rounded Corners & Border -->
  <rect width="850" height="240" rx="14" fill="url(#bgGrad)"/>
  <rect width="850" height="240" rx="14" fill="url(#gridPattern)"/>
  <rect width="848" height="238" x="1" y="1" rx="13" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.8"/>

  <!-- Header Signal Bar -->
  <rect x="35" y="24" width="780" height="34" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <circle cx="55" cy="41" r="5" fill="#D6F24A" class="pulsing-dot" filter="url(#glow)"/>
  <text x="70" y="45" class="accent-badge">SYSTEM SIGNAL // ONLINE</text>
  <text x="260" y="45" class="dim-text">TIU CSE (CLOUD) • 2ND YEAR</text>
  <text x="795" y="45" class="accent-badge" text-anchor="end">BUILDING &amp; SHIPPING ⚡</text>

  <!-- Main Hero Title -->
  <text x="45" y="112" class="title-text" font-size="38">SHUBHAM SHARMA</text>

  <!-- Dynamic Animated Signal Accent Bar -->
  <line x1="45" y1="126" x2="805" y2="126" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="45" y1="126" x2="805" y2="126" stroke="#D6F24A" stroke-width="1.5" stroke-linecap="round" class="flowing-line"/>

  <!-- Subtitle and Intersectional Vision -->
  <text x="45" y="152" class="sub-text">CODE × CLOUD × AI × MUSIC TECHNOLOGY</text>
  <text x="45" y="178" class="tagline">Building high-performance web applications, cloud systems, &amp; intelligent software.</text>

  <!-- Bottom Metadata Row -->
  <g transform="translate(45, 212)">
    <circle cx="5" cy="-4" r="3" fill="#38BDF8"/>
    <text x="16" y="0" class="dim-text">LOCATION: WEST BENGAL, INDIA</text>
    <circle cx="270" cy="-4" r="3" fill="#818CF8"/>
    <text x="281" y="0" class="dim-text">FOCUS: DSA + WEB STUDIO + CLOUD</text>
    <circle cx="580" cy="-4" r="3" fill="#D6F24A"/>
    <text x="591" y="0" class="dim-text">TARGET: 2026 INTERNSHIP</text>
  </g>
</svg>
