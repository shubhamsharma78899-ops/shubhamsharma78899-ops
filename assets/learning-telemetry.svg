<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradTelem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E17"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <style>
      .hdr-telem { font-family: 'SFMono-Regular', Consolas, monospace; font-weight: 700; fill: #D6F24A; font-size: 13px; letter-spacing: 1px; }
      .col-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 14px; }
      .status-pill { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 10px; font-weight: 700; }
      .item-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; fill: #E2E8F0; font-size: 12px; }
      .dim-lbl { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11px; fill: #64748B; }
    </style>
  </defs>

  <!-- Container -->
  <rect width="850" height="300" rx="14" fill="url(#bgGradTelem)"/>
  <rect width="848" height="298" x="1" y="1" rx="13" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Header -->
  <text x="30" y="38" class="hdr-telem">📡 TECH STACK TELEMETRY // LEARNING TRAJECTORY</text>
  <line x1="30" y1="50" x2="820" y2="50" stroke="#1E293B" stroke-width="1"/>

  <!-- COLUMN 1: FOUNDATION -->
  <g transform="translate(30, 70)">
    <rect width="245" height="205" rx="10" fill="#0B132B" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="15" y="15" width="130" height="22" rx="4" fill="#0F2942"/>
    <text x="25" y="30" class="status-pill" fill="#38BDF8">● FOUNDATION</text>
    
    <text x="15" y="60" class="col-title" fill="#F8FAFC">Core Programming</text>

    <!-- Stack Items -->
    <g transform="translate(15, 80)">
      <circle cx="5" cy="8" r="3" fill="#38BDF8"/>
      <text x="18" y="12" class="item-name">C / C++ (Algorithms &amp; Logic)</text>

      <circle cx="5" cy="28" r="3" fill="#38BDF8"/>
      <text x="18" y="32" class="item-name">Python (Sem 1 Foundation)</text>

      <circle cx="5" cy="48" r="3" fill="#38BDF8"/>
      <text x="18" y="52" class="item-name">HTML5 &amp; CSS3 Fundamentals</text>

      <circle cx="5" cy="68" r="3" fill="#38BDF8"/>
      <text x="18" y="72" class="item-name">JavaScript (ES6+ Web Dev)</text>

      <circle cx="5" cy="88" r="3" fill="#38BDF8"/>
      <text x="18" y="92" class="item-name">Git &amp; GitHub Version Control</text>
    </g>
  </g>

  <!-- COLUMN 2: STUDIO & ACTIVE FOCUS -->
  <g transform="translate(302, 70)">
    <rect width="245" height="205" rx="10" fill="#0B132B" stroke="#D6F24A" stroke-width="1.5"/>
    <rect x="15" y="15" width="130" height="22" rx="4" fill="#24330A"/>
    <text x="25" y="30" class="status-pill" fill="#D6F24A">● ACTIVE STUDIO</text>

    <text x="15" y="60" class="col-title" fill="#F8FAFC">Web &amp; Audio Engines</text>

    <!-- Stack Items -->
    <g transform="translate(15, 80)">
      <circle cx="5" cy="8" r="3" fill="#D6F24A"/>
      <text x="18" y="12" class="item-name">TypeScript (Strict Architecture)</text>

      <circle cx="5" cy="28" r="3" fill="#D6F24A"/>
      <text x="18" y="32" class="item-name">React 19 + Vite</text>

      <circle cx="5" cy="48" r="3" fill="#D6F24A"/>
      <text x="18" y="52" class="item-name">Tailwind CSS (Modern UI)</text>

      <circle cx="5" cy="68" r="3" fill="#D6F24A"/>
      <text x="18" y="72" class="item-name">Web Audio API (Lookahead Clock)</text>

      <circle cx="5" cy="88" r="3" fill="#D6F24A"/>
      <text x="18" y="92" class="item-name">Data Structures &amp; Algorithms</text>
    </g>
  </g>

  <!-- COLUMN 3: ROADMAP & CLOUD -->
  <g transform="translate(575, 70)">
    <rect width="245" height="205" rx="10" fill="#0B132B" stroke="#818CF8" stroke-width="1.5"/>
    <rect x="15" y="15" width="130" height="22" rx="4" fill="#1C1D42"/>
    <text x="25" y="30" class="status-pill" fill="#818CF8">● ROADMAP</text>

    <text x="15" y="60" class="col-title" fill="#F8FAFC">Cloud &amp; AI Integration</text>

    <!-- Stack Items -->
    <g transform="translate(15, 80)">
      <circle cx="5" cy="8" r="3" fill="#818CF8"/>
      <text x="18" y="12" class="item-name">AWS / Azure Fundamentals</text>

      <circle cx="5" cy="28" r="3" fill="#818CF8"/>
      <text x="18" y="32" class="item-name">Backend Systems &amp; APIs</text>

      <circle cx="5" cy="48" r="3" fill="#818CF8"/>
      <text x="18" y="52" class="item-name">Speech Input Adapters</text>

      <circle cx="5" cy="68" r="3" fill="#818CF8"/>
      <text x="18" y="72" class="item-name">AI Rhythm Generation</text>

      <circle cx="5" cy="88" r="3" fill="#818CF8"/>
      <text x="18" y="92" class="item-name">Cloud Systems Engineering</text>
    </g>
  </g>
</svg>
